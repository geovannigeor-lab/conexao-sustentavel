<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão Sustentável</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#eef5ef;
}

header{
    background: linear-gradient(135deg,#166534,#22c55e);
    color:white;
    text-align:center;
    padding:80px 20px;
}

header h1{
    font-size:3rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:30px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    text-align:center;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card h3{
    padding:15px;
}

.galeria img{
    width:100%;
    border-radius:15px;
}

h2{
    text-align:center;
    margin-top:40px;
}
</style>

</head>

<body>

<header>
<h1>Conexão Sustentável</h1>
<p>Transformando resíduos em novas possibilidades</p>
</header>

<h2>Materiais Recicláveis</h2>

<div class="grid">

<div class="card"><img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952"><h3>Garrafas PET</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"><h3>Vidro</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1602524200844-4c8a1c1b1e4e"><h3>Papelão</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5"><h3>Pente de ovos</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf"><h3>Pneus</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1627485937980-c4d4fbcfc1c4"><h3>Tampinhas</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f"><h3>Jornais</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1593642634367-d91a135587b5"><h3>Sacolas plásticas</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1580910051074-3eb694886505"><h3>Latinhas</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1586201375761-83865001e31c"><h3>Panelas velhas</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1581091012184-5c8e7f4d0c8d"><h3>Fios elétricos</h3></div>

</div>

<h2>Ideias de Reutilização (Passo a Passo)</h2>

<div class="grid galeria">

<img src="pet.png">
<img src="vidro.png">
<img src="papelao.png">
<img src="pente.png">
<img src="pneus.png">
<img src="tampinhas.png">
<img src="jornais.png">
<img src="sacolas.png">
<img src="latas.png">
<img src="panelas.png">
<img src="fios.png">

</div>

</body>
</html>
